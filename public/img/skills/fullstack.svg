<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d4d4d8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#f4f4f5"/>
  <rect width="800" height="800" fill="url(#dots)" opacity="0.7"/>

  <!-- Browser / UI -->
  <g filter="url(#shadow)">
    <rect x="170" y="165" width="460" height="215" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <line x1="170" y1="203" x2="630" y2="203" stroke="#e4e4e7"/>
  <circle cx="192" cy="184" r="5" fill="#e4e4e7"/>
  <circle cx="208" cy="184" r="5" fill="#e4e4e7"/>
  <circle cx="224" cy="184" r="5" fill="#e4e4e7"/>
  <rect x="300" y="174" width="200" height="20" rx="10" fill="#f4f4f5"/>
  <text x="400" y="188" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#a1a1aa">shared-resources.app</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="194" y="236" font-size="15" font-weight="700" fill="#18181b">Lab 3 · Novembro</text>
    <text x="194" y="256" font-size="11" fill="#a1a1aa">Escolha um horário livre</text>
  </g>
  <!-- calendar -->
  <g fill="#f4f4f5">
    <rect x="194" y="272" width="30" height="26" rx="5"/>
    <rect x="230" y="272" width="30" height="26" rx="5"/>
    <rect x="266" y="272" width="30" height="26" rx="5" fill="#e4e4e7"/>
    <rect x="302" y="272" width="30" height="26" rx="5"/>
    <rect x="338" y="272" width="30" height="26" rx="5"/>
    <rect x="194" y="304" width="30" height="26" rx="5"/>
    <rect x="230" y="304" width="30" height="26" rx="5" fill="#18181b"/>
    <rect x="266" y="304" width="30" height="26" rx="5"/>
    <rect x="302" y="304" width="30" height="26" rx="5" fill="#e4e4e7"/>
    <rect x="338" y="304" width="30" height="26" rx="5"/>
    <rect x="194" y="336" width="30" height="26" rx="5"/>
    <rect x="230" y="336" width="30" height="26" rx="5"/>
    <rect x="266" y="336" width="30" height="26" rx="5"/>
    <rect x="302" y="336" width="30" height="26" rx="5"/>
    <rect x="338" y="336" width="30" height="26" rx="5" fill="#e4e4e7"/>
  </g>
  <!-- detail panel -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="400" y="222" width="206" height="140" rx="10" fill="#fafafa" stroke="#f4f4f5"/>
    <text x="416" y="248" font-size="11" letter-spacing="1.5" fill="#a1a1aa">HORÁRIO</text>
    <text x="416" y="270" font-size="16" font-weight="600" fill="#18181b">14:00 – 15:30</text>
    <rect x="416" y="284" width="120" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="416" y="298" width="84" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="416" y="320" width="174" height="30" rx="6" fill="#18181b"/>
    <text x="503" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Reservar</text>
  </g>

  <!-- Connector UI -> API -->
  <line x1="400" y1="380" x2="400" y2="446" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 5"/>
  <rect x="414" y="402" width="92" height="22" rx="11" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="460" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#71717a">POST /reservas</text>

  <!-- Docker boundary -->
  <rect x="250" y="436" width="300" height="200" rx="16" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="6 6"/>
  <text x="266" y="624" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">docker compose</text>

  <!-- API -->
  <g filter="url(#shadow)">
    <rect x="320" y="446" width="160" height="52" rx="26" fill="#18181b"/>
  </g>
  <text x="400" y="469" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">API</text>
  <text x="400" y="487" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">Fastify · TypeScript</text>

  <!-- Connector API -> DB -->
  <line x1="400" y1="498" x2="400" y2="530" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- Database -->
  <g filter="url(#shadow)">
    <path d="M350 542 v56 a50 13 0 0 0 100 0 v-56" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
    <ellipse cx="400" cy="542" rx="50" ry="13" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  </g>
  <path d="M350 570 a50 13 0 0 0 100 0" fill="none" stroke="#d4d4d8" stroke-width="1.2"/>
  <text x="400" y="590" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#71717a">MySQL</text>
</svg>
