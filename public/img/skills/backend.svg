<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d4d4d8"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#f4f4f5"/>
  <rect width="800" height="800" fill="url(#dots)" opacity="0.7"/>

  <!-- Editor -->
  <g filter="url(#shadow)">
    <rect x="110" y="190" width="520" height="330" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <line x1="110" y1="236" x2="630" y2="236" stroke="#e4e4e7"/>
  <circle cx="136" cy="213" r="5.5" fill="#e4e4e7"/>
  <circle cx="154" cy="213" r="5.5" fill="#e4e4e7"/>
  <circle cx="172" cy="213" r="5.5" fill="#e4e4e7"/>
  <text x="370" y="218" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a1a1aa">src/routes/reservas.ts</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3f3f46">
    <g fill="#d4d4d8" text-anchor="end">
      <text x="152" y="274">1</text>
      <text x="152" y="302">2</text>
      <text x="152" y="330">3</text>
      <text x="152" y="358">4</text>
      <text x="152" y="386">5</text>
      <text x="152" y="414">6</text>
      <text x="152" y="442">7</text>
      <text x="152" y="470">8</text>
    </g>
    <text x="172" y="274"><tspan fill="#18181b" font-weight="700">import</tspan> Fastify <tspan fill="#18181b" font-weight="700">from</tspan> <tspan fill="#a1a1aa">'fastify'</tspan></text>
    <text x="172" y="330"><tspan fill="#18181b" font-weight="700">const</tspan> app = Fastify()</text>
    <text x="172" y="386">app.get(<tspan fill="#a1a1aa">'/reservas/:id'</tspan>, <tspan fill="#18181b" font-weight="700">async</tspan> (req) =&gt; {</text>
    <text x="196" y="414"><tspan fill="#18181b" font-weight="700">return</tspan> db.reserva.find(req.params.id)</text>
    <text x="172" y="442">})</text>
    <rect x="172" y="456" width="2" height="19" fill="#18181b"/>
  </g>

  <!-- Response -->
  <g filter="url(#shadow)">
    <rect x="400" y="440" width="300" height="190" rx="14" fill="#18181b"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="424" y="476" font-size="13" fill="#a1a1aa">GET /reservas/42</text>
    <rect x="606" y="460" width="72" height="24" rx="12" fill="#27272a"/>
    <circle cx="620" cy="472" r="4" fill="#4ade80"/>
    <text x="632" y="477" font-size="12" fill="#fafafa">200</text>
    <line x1="424" y1="496" x2="676" y2="496" stroke="#27272a"/>
    <g font-size="14" fill="#fafafa">
      <text x="424" y="526">{</text>
      <text x="442" y="550"><tspan fill="#a1a1aa">"sala"</tspan>: "Lab 3",</text>
      <text x="442" y="574"><tspan fill="#a1a1aa">"status"</tspan>: "confirmada"</text>
      <text x="424" y="598">}</text>
    </g>
  </g>

  <!-- Latency chip -->
  <g filter="url(#shadow)">
    <rect x="80" y="560" width="190" height="56" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <text x="100" y="584" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="1.5" fill="#a1a1aa">LATÊNCIA</text>
  <text x="100" y="604" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#18181b">12 ms</text>
  <polyline points="190,600 202,592 214,596 226,584 238,588 250,578" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
