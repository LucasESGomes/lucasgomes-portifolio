<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#d4d4d8"/>
    </pattern>
    <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#f4f4f5"/>
      <rect width="4" height="10" fill="#ececef"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#f4f4f5"/>
  <rect width="800" height="800" fill="url(#dots)" opacity="0.7"/>

  <!-- Browser -->
  <g filter="url(#shadow)">
    <rect x="130" y="150" width="520" height="300" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <line x1="130" y1="188" x2="650" y2="188" stroke="#e4e4e7"/>
  <circle cx="152" cy="169" r="5" fill="#e4e4e7"/>
  <circle cx="168" cy="169" r="5" fill="#e4e4e7"/>
  <circle cx="184" cy="169" r="5" fill="#e4e4e7"/>
  <rect x="290" y="159" width="200" height="20" rx="10" fill="#f4f4f5"/>
  <text x="390" y="173" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#a1a1aa">localhost:5173</text>

  <!-- navbar -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="154" y="206" width="18" height="18" rx="5" fill="#18181b"/>
    <text x="180" y="220" font-size="13" font-weight="700" fill="#18181b">studio</text>
    <text x="400" y="220" font-size="11" fill="#71717a">Início</text>
    <text x="446" y="220" font-size="11" fill="#71717a">Projetos</text>
    <text x="504" y="220" font-size="11" fill="#71717a">Contato</text>
    <rect x="566" y="204" width="62" height="22" rx="11" fill="none" stroke="#18181b" stroke-width="1.2"/>
    <text x="597" y="219" text-anchor="middle" font-size="10.5" font-weight="600" fill="#18181b">Entrar</text>
  </g>
  <line x1="130" y1="240" x2="650" y2="240" stroke="#f4f4f5"/>

  <!-- hero -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="154" y="262" width="96" height="20" rx="10" fill="#eef2ff"/>
    <circle cx="166" cy="272" r="3.5" fill="#4f46e5"/>
    <text x="175" y="276" font-size="10" font-weight="600" fill="#4f46e5">Novo layout</text>
    <text x="154" y="314" font-size="24" font-weight="800" fill="#18181b" letter-spacing="-0.5">Interfaces que</text>
    <text x="154" y="342" font-size="24" font-weight="800" fill="#18181b" letter-spacing="-0.5">cabem em <tspan fill="#4f46e5">toda tela</tspan></text>
    <rect x="154" y="358" width="200" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="154" y="371" width="150" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="154" y="394" width="110" height="32" rx="8" fill="#4f46e5"/>
    <text x="209" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Começar</text>
    <rect x="274" y="394" width="96" height="32" rx="8" fill="#ffffff" stroke="#e4e4e7"/>
    <text x="322" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#18181b">Ver mais</text>
  </g>

  <!-- product card -->
  <rect x="420" y="258" width="206" height="170" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="432" y="270" width="182" height="86" rx="8" fill="url(#stripes)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="432" y="378" font-size="13" font-weight="700" fill="#18181b">Card component</text>
    <rect x="432" y="388" width="120" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="432" y="404" width="44" height="16" rx="8" fill="#f4f4f5"/>
    <text x="454" y="415" text-anchor="middle" font-size="9" fill="#71717a">React</text>
    <rect x="482" y="404" width="52" height="16" rx="8" fill="#f4f4f5"/>
    <text x="508" y="415" text-anchor="middle" font-size="9" fill="#71717a">Tailwind</text>
    <circle cx="600" cy="410" r="11" fill="#18181b"/>
    <path d="M596 410 h8 m-3.5 -3.5 l3.5 3.5 l-3.5 3.5" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- cursor on the primary button -->
  <path d="M246 414 l0 22 l6 -5.5 l4 9 l4 -1.8 l-4 -8.6 l8 -0.6 z" fill="#18181b" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Components panel -->
  <g filter="url(#shadow)">
    <rect x="430" y="480" width="260" height="170" rx="14" fill="#18181b"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="454" y="510" font-size="11" letter-spacing="1.5" fill="#a1a1aa">COMPONENTES</text>
    <line x1="454" y1="524" x2="666" y2="524" stroke="#27272a"/>
    <!-- toggle -->
    <text x="454" y="551" font-size="13" fill="#fafafa">Modo escuro</text>
    <rect x="626" y="538" width="40" height="22" rx="11" fill="#4f46e5"/>
    <circle cx="655" cy="549" r="8" fill="#ffffff"/>
    <!-- checkbox -->
    <text x="454" y="585" font-size="13" fill="#fafafa">Notificações</text>
    <rect x="646" y="572" width="20" height="20" rx="5" fill="#fafafa"/>
    <path d="M651 582 l3.5 3.5 l6.5 -7" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- slider -->
    <text x="454" y="619" font-size="13" fill="#fafafa">Volume</text>
    <rect x="540" y="612" width="126" height="4" rx="2" fill="#3f3f46"/>
    <rect x="540" y="612" width="80" height="4" rx="2" fill="#4f46e5"/>
    <circle cx="620" cy="614" r="8" fill="#ffffff"/>
  </g>

  <!-- Responsive chip -->
  <g filter="url(#shadow)">
    <rect x="110" y="490" width="260" height="120" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="134" y="520" font-size="11" letter-spacing="1.5" fill="#a1a1aa">RESPONSIVO</text>
    <!-- phone -->
    <rect x="142" y="538" width="24" height="42" rx="5" fill="none" stroke="#18181b" stroke-width="1.5"/>
    <line x1="150" y1="575" x2="158" y2="575" stroke="#18181b" stroke-width="1.5" stroke-linecap="round"/>
    <text x="154" y="598" text-anchor="middle" font-size="11" fill="#71717a">375</text>
    <!-- tablet -->
    <rect x="198" y="534" width="40" height="48" rx="5" fill="none" stroke="#18181b" stroke-width="1.5"/>
    <text x="218" y="598" text-anchor="middle" font-size="11" fill="#71717a">768</text>
    <!-- desktop -->
    <rect x="270" y="534" width="74" height="40" rx="4" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <line x1="307" y1="574" x2="307" y2="582" stroke="#4f46e5" stroke-width="1.5"/>
    <line x1="295" y1="582" x2="319" y2="582" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round"/>
    <text x="307" y="598" text-anchor="middle" font-size="11" font-weight="600" fill="#4f46e5">1280</text>
  </g>

  <!-- JSX snippet -->
  <rect x="110" y="630" width="230" height="30" rx="15" fill="#ffffff" stroke="#e4e4e7"/>
  <text x="225" y="650" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#71717a">&lt;<tspan fill="#18181b" font-weight="700">Button</tspan> variant=<tspan fill="#4f46e5">"primary"</tspan> /&gt;</text>
</svg>
